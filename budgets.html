<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - งบประมาณ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673', hidden: '#ef4444' } } } } }</script>
    <link rel="stylesheet" href="style.css">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="text-gray-800 antialiased">
    <div id="mainNav"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">งบประมาณ</h1>
                <p class="text-sm text-gray-500 mt-1">ตั้งงบรายเดือนสำหรับสัตว์เลี้ยงแต่ละตัว</p>
            </div>
            <button onclick="Budgets.openModal()" class="btn btn-primary">
                <i class="fa-solid fa-plus mr-2"></i> ตั้งงบใหม่
            </button>
        </div>

        <!-- Filters: เลือกสัตว์เลี้ยง / เดือน / ปี ที่ต้องการดูงบประมาณ -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap gap-3 items-end">
            <div>
                <label for="filterPet" class="block text-xs font-medium text-gray-500 mb-1">สัตว์เลี้ยง</label>
                <select id="filterPet" onchange="Budgets.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                    <option value="">ทุกสัตว์เลี้ยง</option>
                </select>
            </div>
            <div>
                <label for="filterMonth" class="block text-xs font-medium text-gray-500 mb-1">เดือน</label>
                <select id="filterMonth" onchange="Budgets.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                    <option value="">ทุกเดือน</option>
                </select>
            </div>
            <div>
                <label for="filterYear" class="block text-xs font-medium text-gray-500 mb-1">ปี</label>
                <select id="filterYear" onchange="Budgets.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                    <option value="">ทุกปี</option>
                </select>
            </div>
            <button onclick="Budgets.clearFilters()" class="ml-auto btn btn-secondary">
                <i class="fa-solid fa-rotate-left mr-1"></i> ล้างตัวกรอง
            </button>
        </div>

        <div id="budgetList" class="space-y-4">
            <div class="text-center py-12 text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลด...</div>
        </div>
    </main>

    <!-- Modal -->
    <div id="budgetModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Budgets.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">ตั้งงบประมาณรายเดือน</h3>
                    <div class="space-y-4">
                        <div><label class="block text-sm font-medium text-gray-700">สัตว์เลี้ยง <span class="text-red-500">*</span></label><select id="formPet" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none"></select></div>
                        <div><label class="block text-sm font-medium text-gray-700">งบประมาณ (บาท) <span class="text-red-500">*</span></label><input id="formLimit" type="number" placeholder="เช่น 3000" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700">เดือน</label><select id="formMonth" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none"></select></div>
                            <div><label class="block text-sm font-medium text-gray-700">ปี</label><input id="formYear" type="number" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button onclick="Budgets.save()" class="w-full sm:w-auto sm:ml-3 btn btn-primary">บันทึก</button>
                    <button onclick="Budgets.closeModal()" class="mt-3 w-full sm:w-auto sm:mt-0 btn btn-secondary">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.env.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/budgets.js"></script>
    <script>
        (function() {
            if (!UI.initPage('budgets')) return;

            // ต้อง auto-link + โหลดโปรไฟล์ให้เสร็จก่อนค่อยโหลดข้อมูล เพราะ RLS ของ Supabase
            // กรองข้อมูลตาม auth_user_id() (อ่านจาก users.auth_id = auth.uid()) ถ้ายังไม่ได้
            // link บัญชีกับแถว users ก่อน query จะไม่เห็นงบประมาณของตัวเองเลย
            Auth.autoLinkUser().finally(function() {
                return Auth.loadProfile().catch(function() { return null; });
            }).then(function() {
                var nav = document.getElementById('mainNav');
                if (nav) nav.innerHTML = UI.renderNav('budgets');
                return Budgets.init();
            }).catch(function(err) {
                console.error('Budgets page init error:', err);
            });
        })();
    </script>
</body>
</html>
