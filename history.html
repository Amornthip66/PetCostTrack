<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - ประวัติรายจ่าย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673', hidden: '#ef4444' } } } } }</script>
    <link rel="stylesheet" href="style.css?v=20260905">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="text-gray-800 antialiased">
    <div id="mainNav"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">ประวัติรายจ่าย</h1>
                <p class="text-sm text-gray-500 mt-1">รายการค่าใช้จ่ายทั้งหมดของสัตว์เลี้ยง</p>
            </div>
            <button onclick="History.openModal()" class="mt-4 sm:mt-0 w-full sm:w-auto btn btn-primary">
                <i class="fa-solid fa-plus mr-2"></i> เพิ่มรายจ่าย
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap gap-3 items-center">
            <select id="filterType" onchange="History.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet outline-none">
                <option value="">ทุกประเภท</option>
                <option value="หลัก">ค่าใช้จ่ายปกติ</option>
                <option value="แฝง">ค่าใช้จ่ายแฝง</option>
            </select>
            <select id="filterPet" onchange="History.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet outline-none">
                <option value="">ทุกสัตว์เลี้ยง</option>
            </select>
            <select id="filterCategory" onchange="History.load()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-pet outline-none">
                <option value="">ทุกหมวดหมู่</option>
            </select>
            <div class="flex items-center gap-2 ml-auto">
                <span class="text-sm text-gray-500">ยอดรวม:</span>
                <span id="totalFiltered" class="text-lg font-bold text-pet">฿ 0</span>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-4 py-3 text-left font-medium">วันที่</th>
                            <th class="px-4 py-3 text-left font-medium">รายการ</th>
                            <th class="px-4 py-3 text-left font-medium">สัตว์เลี้ยง</th>
                            <th class="px-4 py-3 text-left font-medium">หมวดหมู่</th>
                            <th class="px-4 py-3 text-left font-medium">ประเภท</th>
                            <th class="px-4 py-3 text-right font-medium">จำนวนเงิน</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="divide-y divide-gray-100">
                        <tr><td colspan="6" class="px-4 py-12 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลด...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="expenseModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="History.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">บันทึกรายจ่ายใหม่</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">หมวดหมู่ <span class="text-red-500">*</span></label>
                            <select id="formCategory" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                                <optgroup label="รายจ่ายปกติ"><option value="1">ค่าอาหาร</option><option value="2">ค่าวัคซีน/ตรวจสุขภาพ</option><option value="3">ถ่ายพยาธิ</option></optgroup>
                                <optgroup label="ค่าใช้จ่ายแฝง"><option value="4" selected>ค่ารักษาพยาบาลฉุกเฉิน</option><option value="5">ค่าซ่อมแซมสิ่งของเสียหาย</option><option value="6">ค่าฝากเลี้ยง</option></optgroup>
                            </select>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700">รายการ</label><input id="formNote" type="text" placeholder="รายละเอียด" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700">จำนวนเงิน (บาท) <span class="text-red-500">*</span></label><input id="formAmount" type="number" placeholder="0.00" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none"></div>
                            <div><label class="block text-sm font-medium text-gray-700">วันที่ <span class="text-red-500">*</span></label><input id="formDate" type="date" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none"></div>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700">สัตว์เลี้ยง <span class="text-red-500">*</span></label><select id="formPet" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none"><option value="">กำลังโหลด...</option></select></div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button onclick="History.submit()" class="w-full sm:w-auto sm:ml-3 btn btn-primary">บันทึก</button>
                    <button onclick="History.closeModal()" class="mt-3 w-full sm:w-auto sm:mt-0 btn btn-secondary">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.env.js?v=20260905"></script>
    <script src="js/api.js?v=20260905"></script>
    <script src="js/auth.js?v=20260905"></script>
    <script src="js/components.js?v=20260905"></script>
    <script src="js/history.js?v=20260905"></script>
    <script>
        (function() {
            if (!UI.initPage('history')) return;

            // ต้อง auto-link + โหลดโปรไฟล์ให้เสร็จก่อนค่อยโหลดข้อมูล เพราะ RLS ของ Supabase
            // กรองข้อมูลตาม auth_user_id() (อ่านจาก users.auth_id = auth.uid()) ถ้ายังไม่ได้
            // link บัญชีกับแถว users ก่อน query จะไม่เห็นรายการของตัวเองเลย
            Auth.autoLinkUser().finally(function() {
                return Auth.loadProfile().catch(function() { return null; });
            }).then(function() {
                var nav = document.getElementById('mainNav');
                if (nav) nav.innerHTML = UI.renderNav('history');
                return History.init();
            }).catch(function(err) {
                console.error('History page init error:', err);
            });
        })();
    </script>
</body>
</html>
