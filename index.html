<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - แดชบอร์ด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#e0f2fe', DEFAULT: '#0ea5e9', dark: '#0369a1', hidden: '#ef4444' } } } }
        }
    </script>
    <style>body { background-color: #f8fafc; }</style>
</head>
<body class="text-gray-800 antialiased">

    <!-- ====== NAV BAR ====== -->
    <div id="mainNav"></div>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">ภาพรวมค่าใช้จ่าย</h1>
                <p class="text-sm text-gray-500 mt-1">ประจำเดือน: <span class="font-semibold text-gray-700">สิงหาคม 2569</span></p>
            </div>
            <button onclick="Dashboard.openModal()" class="mt-4 sm:mt-0 w-full sm:w-auto flex items-center justify-center px-5 py-2.5 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-pet-DEFAULT hover:bg-pet-dark transition-colors">
                <i class="fa-solid fa-plus mr-2"></i> เพิ่มรายจ่ายใหม่
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-pet-DEFAULT">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">ยอดรวมเดือนนี้</p>
                        <p class="text-3xl font-bold text-gray-900 mt-1">฿ <span id="totalSpent">—</span></p>
                    </div>
                    <div class="p-3 bg-pet-light rounded-full text-pet-DEFAULT"><i class="fa-solid fa-wallet text-xl"></i></div>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 rounded-full h-2"><div id="budgetBar" class="bg-pet-DEFAULT h-2 rounded-full transition-all" style="width: 0%"></div></div>
                    <p class="text-xs text-gray-500 mt-2">ใช้งบไปแล้ว <span id="budgetPercent">—</span>% จากงบที่ตั้งไว้ (฿ <span id="budgetTotal">—</span>)</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-pet-hidden">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">ยอด <span class="text-pet-hidden font-semibold">ค่าใช้จ่ายแฝง</span></p>
                        <p class="text-3xl font-bold text-pet-hidden mt-1">฿ <span id="hiddenCost">—</span></p>
                    </div>
                    <div class="p-3 bg-red-100 rounded-full text-pet-hidden"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                </div>
                <p class="text-xs text-gray-500 mt-4 flex items-center"><i class="fa-solid fa-arrow-trend-up text-red-500 mr-1"></i> สูงกว่าเดือนที่แล้ว 15%</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-amber-400">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">จำนวนสัตว์เลี้ยง (ตัว)</p>
                        <p class="text-3xl font-bold text-gray-900 mt-1"><span id="petCount">—</span></p>
                    </div>
                    <div class="p-3 bg-amber-100 rounded-full text-amber-500"><i class="fa-solid fa-dog text-xl"></i></div>
                </div>
            </div>
        </div>

        <!-- Chart + Expense List -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-1 border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">สัดส่วนค่าใช้จ่าย</h3>
                <div class="relative h-64 w-full flex justify-center"><canvas id="expenseChart"></canvas></div>
                <div id="chartLegend" class="mt-4 grid grid-cols-2 gap-2 text-sm"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2 border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">รายการล่าสุด</h3>
                </div>
                <div class="overflow-hidden">
                    <ul id="expenseList" class="divide-y divide-gray-100">
                        <li class="py-8 text-center text-gray-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลด...</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- ====== MODAL: เพิ่มรายจ่าย ====== -->
    <div id="expenseModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Dashboard.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-pet-light sm:mx-0 sm:h-10 sm:w-10"><i class="fa-solid fa-wallet text-pet-DEFAULT text-xl"></i></div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900">บันทึกรายจ่ายใหม่</h3>
                            <div class="mt-4 space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">หมวดหมู่ <span class="text-red-500">*</span></label>
                                    <select id="formCategory" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 bg-gray-50 rounded-md border">
                                        <optgroup label="รายจ่ายปกติ">
                                            <option value="1">ค่าอาหาร</option>
                                            <option value="2">ค่าวัคซีน/ตรวจสุขภาพ</option>
                                            <option value="3">ถ่ายพยาธิ</option>
                                        </optgroup>
                                        <optgroup label="ค่าใช้จ่ายแฝง">
                                            <option value="4" selected>ค่ารักษาพยาบาลฉุกเฉิน</option>
                                            <option value="5">ค่าซ่อมแซมสิ่งของเสียหาย</option>
                                            <option value="6">ค่าฝากเลี้ยง</option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">รายการ <span class="text-red-500">*</span></label>
                                    <input id="formNote" type="text" placeholder="เช่น สุนัขกินของเล่นเข้าไป" class="mt-1 border border-gray-300 bg-gray-50 rounded-md block w-full py-2 px-3 sm:text-sm">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">จำนวนเงิน (บาท) <span class="text-red-500">*</span></label>
                                        <input id="formAmount" type="number" placeholder="0.00" class="mt-1 border border-gray-300 bg-gray-50 rounded-md block w-full py-2 px-3 sm:text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">วันที่ <span class="text-red-500">*</span></label>
                                        <input id="formDate" type="date" class="mt-1 border border-gray-300 bg-gray-50 rounded-md block w-full py-2 px-3 sm:text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">สัตว์เลี้ยง <span class="text-red-500">*</span></label>
                                    <select id="formPet" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 bg-gray-50 rounded-md border">
                                        <option value="">กำลังโหลด...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="Dashboard.submitExpense()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-pet-DEFAULT text-base font-medium text-white hover:bg-pet-dark sm:ml-3 sm:w-auto sm:text-sm">บันทึกข้อมูล</button>
                    <button type="button" onclick="Dashboard.closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== SCRIPTS ====== -->
    <script src="js/config.env.js?v=2.2"></script>
    <script src="js/api.js?v=2.2"></script>
    <script src="js/auth.js?v=2.2"></script>
    <script src="js/components.js?v=2.2"></script>
    <script src="js/dashboard.js?v=2.2"></script>
    <script>
        // === Auth Callback: จัดการ redirect จาก Supabase ===
        (function() {
            var hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                var params = new URLSearchParams(hash.substring(1));
                var accessToken = params.get('access_token');
                var refreshToken = params.get('refresh_token');
                var expiresIn = parseInt(params.get('expires_in') || '3600');
                var expiresAt = Math.floor(Date.now() / 1000) + expiresIn;
                
                if (accessToken) {
                    Auth.saveSession({
                        access_token: accessToken,
                        refresh_token: refreshToken,
                        expires_in: expiresIn,
                        expires_at: expiresAt
                    });
                    window.location.hash = '';
                    window.location.reload();
                    return;
                }
            }
            
            // ตรวจสอบ error จาก Supabase
            if (hash && hash.includes('error=')) {
                var errorParams = new URLSearchParams(hash.substring(1));
                var error = errorParams.get('error');
                var errorDesc = errorParams.get('error_description');
                console.error('Auth error:', error, errorDesc);
                alert('เกิดข้อผิดพลาด: ' + (errorDesc || error));
                window.location.hash = '';
            }
        })();

        // === Init: ตรวจสอบ auth แล้วโหลดข้อมูล ===
        (function() {
            if (!UI.initPage('dashboard')) return;

            // Auto-link user กับ seed data ก่อนโหลด profile
            Auth.autoLinkUser().then(function() {
                return Auth.loadProfile();
            }).catch(function(err) {
                console.warn('Profile link warning:', err);
                return Auth.loadProfile();
            }).then(function(user) {
                // อัปเดต Navbar หลังโหลด profile สำเร็จ
                var nav = document.getElementById('mainNav');
                if (nav) nav.innerHTML = UI.renderNav('dashboard');

                // ตั้งค่าวันที่ปัจจุบันในฟอร์ม
                var today = new Date();
                var dateInput = document.getElementById('formDate');
                if (dateInput) dateInput.value = today.toISOString().split('T')[0];

                // โหลดข้อมูล dashboard
                return Dashboard.init();
            }).catch(function(err) {
                console.error('Init error in dashboard:', err);
                // พยายามโหลด Dashboard แม้จะมี warning
                Dashboard.init().catch(function(e) {
                    console.error('Dashboard init failed:', e);
                });
            });
        })();
    </script>
</body>
</html>
