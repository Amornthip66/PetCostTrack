<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - เข้าสู่ระบบ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673' } } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-purple-100">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <i class="fa-solid fa-paw text-5xl text-pet mb-3"></i>
            <h1 class="text-3xl font-bold text-gray-900">PetCostTrack</h1>
            <p class="text-gray-500 mt-1">แดชบอร์ดสรุปค่าใช้จ่ายสัตว์เลี้ยง</p>
        </div>

        <!-- Tabs -->
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button id="tabLogin" onclick="showTab('login')" class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-pet transition">เข้าสู่ระบบ</button>
            <button id="tabSignup" onclick="showTab('signup')" class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500 transition">สมัครสมาชิก</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                    <input id="loginEmail" type="email" required placeholder="your@email.com"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                    <input id="loginPassword" type="password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
            </div>
            <button type="submit" id="loginBtn"
                class="w-full mt-6 btn btn-primary">
                <span>เข้าสู่ระบบ</span>
            </button>
            <p id="loginError" class="text-red-500 text-sm mt-2 text-center hidden"></p>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="hidden">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                    <input id="signupName" type="text" required placeholder="ปานชนก พรหมศรีสวัสดิ์"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                    <input id="signupEmail" type="email" required placeholder="your@email.com"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                    <input id="signupPassword" type="password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">บทบาท</label>
                    <select id="signupRole" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                        <option value="Owner">Owner (เจ้าของสัตว์เลี้ยง)</option>
                        <option value="Co-caretaker">Co-caretaker (ผู้ร่วมดูแล)</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="signupBtn"
                class="w-full mt-6 btn btn-primary">
                <span>สมัครสมาชิก</span>
            </button>
            <p id="signupError" class="text-red-500 text-sm mt-2 text-center hidden"></p>
            <p id="signupSuccess" class="text-green-600 text-sm mt-2 text-center hidden"></p>
        </form>
    </div>

    <!-- Scripts -->
    <script src="js/config.env.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
