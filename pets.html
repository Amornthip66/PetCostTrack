<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - สัตว์เลี้ยงของฉัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673', hidden: '#ef4444' } } } } }
    </script>
    <link rel="stylesheet" href="style.css?v=20260909">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="text-gray-800 antialiased">
    <div id="mainNav"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">สัตว์เลี้ยงของฉัน</h1>
                <p class="text-sm text-gray-500 mt-1">จัดการสัตว์เลี้ยงที่คุณดูแล</p>
            </div>
            <button onclick="Pets.openModal()" class="mt-4 sm:mt-0 w-full sm:w-auto btn btn-primary">
                <i class="fa-solid fa-plus mr-2"></i> เพิ่มสัตว์เลี้ยง
            </button>
        </div>

        <div id="petsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลด...</div>
        </div>
    </main>

    <!-- Modal เพิ่ม/แก้ไข สัตว์เลี้ยง -->
    <div id="petModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Pets.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 id="petModalTitle" class="text-lg font-medium text-gray-900 mb-4">เพิ่มสัตว์เลี้ยงใหม่</h3>
                    <input id="formPetId" type="hidden" value="">
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ชื่อ <span class="text-red-500">*</span></label>
                                <input id="formPetName" type="text" required placeholder="เช่น น้องโบโบ้" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ประเภทสัตว์เลี้ยง <span class="text-red-500">*</span></label>
                                <input id="formPetType" type="text" required placeholder="เช่น สุนัข, แมว" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">เพศ <span class="text-red-500">*</span></label>
                                <select id="formPetGender" required class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                                    <option value="">เลือกเพศ</option>
                                    <option value="ผู้">ผู้</option>
                                    <option value="เมีย">เมีย</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">อายุ (ปี) <span class="text-red-500">*</span></label>
                                <input id="formPetAge" type="number" min="0" required placeholder="เช่น 3" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">สายพันธุ์</label>
                                <input id="formPetBreed" type="text" placeholder="เช่น ชิสุ, โกลเด้น" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">น้ำหนัก (กก.)</label>
                                <input id="formPetWeight" type="number" step="0.01" placeholder="เช่น 5.5" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">วันเกิด</label>
                                <input id="formPetBirthdate" type="date" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">วันที่รับเลี้ยง</label>
                                <input id="formPetAdoptionDate" type="date" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">หมายเลขไมโครชิป</label>
                            <input id="formPetMicrochip" type="text" placeholder="ระบุหมายเลข" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">รูปภาพสัตว์เลี้ยง</label>
                            <input id="formPetImage" type="file" accept="image/*" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button id="petSaveBtn" onclick="Pets.save()" class="w-full sm:w-auto sm:ml-3 btn btn-primary">บันทึก</button>
                    <button onclick="Pets.closeModal()" class="mt-3 w-full sm:w-auto sm:mt-0 btn btn-secondary">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal จัดการครอบครัว -->
    <div id="familyModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Pets.closeFamilyModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-1"><i class="fa-solid fa-users mr-2 text-pet-DEFAULT"></i>จัดการครอบครัว</h3>
                    <p class="text-sm text-gray-500 mb-4">ผู้ร่วมดูแล <span id="familyModalPetName" class="font-medium text-gray-700"></span></p>

                    <div class="flex gap-2 mb-1">
                        <input id="familyAddEmail" type="email" placeholder="อีเมลสมาชิกที่ลงทะเบียนแล้ว" class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                        <button onclick="Pets.addFamilyMember()" class="px-4 py-2.5 bg-pet text-white text-sm font-medium rounded-lg hover:bg-pet-dark transition whitespace-nowrap"><i class="fa-solid fa-user-plus mr-1"></i>เชิญ</button>
                    </div>
                    <p id="familyAddMsg" class="text-red-500 text-sm mb-3 hidden"></p>

                    <div class="mt-4 border-t border-gray-100 pt-3">
                        <div id="familyMembersList"></div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button onclick="Pets.closeFamilyModal()" class="w-full sm:w-auto px-4 py-2 bg-pet text-white rounded-lg hover:bg-pet-dark transition">ปิด</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เก็บเข้าคลัง (แทนการลบถาวร) -->
    <div id="archiveModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Pets.closeArchiveModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-1"><i class="fa-solid fa-box-archive mr-2 text-pet-DEFAULT"></i>เก็บเข้าคลัง</h3>
                    <p class="text-sm text-gray-500 mb-4">"<span id="archiveModalPetName" class="font-medium text-gray-700"></span>" จะย้ายไปอยู่ในคลังสัตว์เลี้ยง (ดูย้อนหลังได้ที่หน้าโปรไฟล์) ประวัติค่าใช้จ่ายเดิมจะยังคงอยู่ครบ</p>

                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">เหตุผล <span class="text-red-500">*</span></label>
                            <select id="archiveReason" onchange="Pets.onArchiveReasonChange()" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none">
                                <option value="เสียชีวิต">เสียชีวิต</option>
                                <option value="ย้ายไปอยู่ในความดูแลของผู้อื่น">ย้ายไปอยู่ในความดูแลของผู้อื่น</option>
                                <option value="__other__">อื่นๆ (ระบุเอง)</option>
                            </select>
                        </div>
                        <div id="archiveOtherNoteWrap" class="hidden">
                            <label class="block text-sm font-medium text-gray-700">ระบุรายละเอียด</label>
                            <textarea id="archiveOtherNote" rows="2" placeholder="เช่น หายตัวไป" class="mt-1 w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet outline-none"></textarea>
                        </div>
                    </div>
                    <p id="archiveMsg" class="text-red-500 text-sm mt-3 hidden"></p>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button onclick="Pets.confirmArchive()" class="w-full sm:w-auto sm:ml-3 btn btn-danger">เก็บเข้าคลัง</button>
                    <button onclick="Pets.closeArchiveModal()" class="mt-3 w-full sm:w-auto sm:mt-0 btn btn-secondary">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.env.js?v=20260905"></script>
    <script src="js/api.js?v=20260905"></script>
    <script src="js/auth.js?v=20260905"></script>
    <script src="js/components.js?v=20260905"></script>
    <script src="js/pets.js?v=20260909"></script>
    <script>
        (function() {
            if (!UI.initPage('pets')) return;
            Pets.init();
            Auth.autoLinkUser().finally(function() {
                return Auth.loadProfile().catch(function() { return null; });
            }).then(function() {
                var nav = document.getElementById('mainNav');
                if (nav) nav.innerHTML = UI.renderNav('pets');
            });
        })();
    </script>
</body>
</html>
