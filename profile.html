<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - โปรไฟล์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673', hidden: '#ef4444' } } } } }</script>
    <link rel="stylesheet" href="style.css?v=20260905">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="text-gray-800 antialiased">
    <div id="mainNav"></div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">โปรไฟล์</h1>

        <!-- Profile Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="h-24 bg-gradient-to-r from-pet-DEFAULT to-purple-400"></div>
            <div class="px-6 pb-6">
                <div class="flex items-end gap-4 -mt-10">
                    <img id="profileAvatar" class="h-20 w-20 rounded-full object-cover border-4 border-white shadow" src="" alt="Avatar">
                    <div class="pb-1">
                        <h2 id="profileName" class="text-xl font-bold text-gray-900"></h2>
                        <p id="profileRole" class="text-sm text-gray-500"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">แก้ไขข้อมูลส่วนตัว</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล</label>
                    <input id="editName" type="text" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">อีเมล</label>
                    <input id="editEmail" type="email" disabled class="mt-1 w-full px-4 py-2.5 border border-gray-200 bg-gray-50 rounded-lg text-gray-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">บทบาท</label>
                    <input id="editRole" type="text" disabled class="mt-1 w-full px-4 py-2.5 border border-gray-200 bg-gray-50 rounded-lg text-gray-500">
                </div>
            </div>
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <button onclick="Profile.save()" class="px-5 py-2.5 bg-pet-DEFAULT text-white text-sm font-medium rounded-lg hover:bg-pet-dark transition">บันทึกการแก้ไข</button>
                <button onclick="Profile.changePassword()" class="px-5 py-2.5 text-sm font-medium bg-red-600 text-white rounded-lg hover:bg-red-700 transition">เปลี่ยนรหัสผ่าน</button>
            </div>
            <p id="profileMsg" class="text-green-600 text-sm mt-3 hidden"></p>
        </div>

        <!-- Family Members -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h3 class="text-lg font-semibold text-gray-800">สมาชิกในครอบครัว</h3>
                <button onclick="Profile.openInviteModal()" class="w-full sm:w-auto flex items-center justify-center px-3 py-1.5 text-sm bg-pet-DEFAULT text-white rounded-lg hover:bg-pet-dark transition"><i class="fa-solid fa-user-plus mr-1"></i>เพิ่มสมาชิกในครอบครัว</button>
            </div>
            <div id="familyList" class="text-gray-400 text-sm">กำลังโหลด...</div>
        </div>
    </main>

    <!-- Modal เพิ่มสมาชิกในครอบครัว -->
    <div id="inviteModal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="Profile.closeInviteModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-1"><i class="fa-solid fa-user-plus mr-2 text-pet-DEFAULT"></i>เพิ่มสมาชิกในครอบครัว</h3>
                    <p class="text-sm text-gray-500 mb-4">เชิญสมาชิกที่ลงทะเบียนแล้วให้เป็นผู้ร่วมดูแลสัตว์เลี้ยงของคุณ</p>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">อีเมลสมาชิก</label>
                        <input id="inviteEmail" type="email" placeholder="อีเมลสมาชิกที่ลงทะเบียนแล้ว" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">ให้ดูแลสัตว์เลี้ยง</label>
                        <div id="invitePetsList" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    </div>

                    <p id="inviteMsg" class="text-red-500 text-sm mt-3 hidden"></p>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button onclick="Profile.addFamilyMember()" class="w-full sm:w-auto px-4 py-2 bg-pet-DEFAULT text-white rounded-lg hover:bg-pet-dark transition sm:ml-3">เชิญสมาชิก</button>
                    <button onclick="Profile.closeInviteModal()" class="mt-3 w-full sm:w-auto px-4 py-2 bg-pet-DEFAULT text-white rounded-lg hover:bg-pet-dark transition sm:mt-0">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.env.js"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js?v=20260905"></script>
    <script src="js/profile.js?v=2"></script>
    <script>
        (function() {
            if (!UI.initPage('profile')) return;
            Auth.autoLinkUser().then(function() {
                return Auth.loadProfile();
            }).then(function() { Profile.init(); })
            .catch(function(err) {
                console.error('Profile page init error:', err);
            });
        })();
    </script>
</body>
</html>
