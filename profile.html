<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - โปรไฟล์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#e0f2fe', DEFAULT: '#0ea5e9', dark: '#0369a1', hidden: '#ef4444' } } } } }</script>
    <style>body { background-color: #f8fafc; }</style>
</head>
<body class="text-gray-800 antialiased">
    <div id="mainNav"></div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">โปรไฟล์</h1>

        <!-- Profile Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="h-24 bg-gradient-to-r from-pet-DEFAULT to-sky-400"></div>
            <div class="px-6 pb-6">
                <div class="flex items-end gap-4 -mt-10">
                    <img id="profileAvatar" class="h-20 w-20 rounded-full object-cover border-4 border-white shadow" src="" alt="Avatar">
                    <div class="pb-1">
                        <h2 id="profileName" class="text-xl font-bold text-gray-900"></h2>
                        <p id="profileRole" class="text-sm text-gray-500"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">แก้ไขข้อมูลส่วนตัว</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล</label>
                    <input id="editName" type="text" class="mt-1 w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet-DEFAULT outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">อีเมล</label>
                    <input id="editEmail" type="email" disabled class="mt-1 w-full px-4 py-2.5 border border-gray-200 bg-gray-50 rounded-lg text-gray-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">บทบาท</label>
                    <input id="editRole" type="text" disabled class="mt-1 w-full px-4 py-2.5 border border-gray-200 bg-gray-50 rounded-lg text-gray-500">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="Profile.save()" class="px-5 py-2.5 bg-pet-DEFAULT text-white text-sm font-medium rounded-lg hover:bg-pet-dark transition">บันทึกการแก้ไข</button>
                <button onclick="Profile.changePassword()" class="px-5 py-2.5 text-sm font-medium text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition">เปลี่ยนรหัสผ่าน</button>
            </div>
            <p id="profileMsg" class="text-green-600 text-sm mt-3 hidden"></p>
        </div>

        <!-- Family Members -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">สมาชิกในครอบครัว</h3>
            <div id="familyList" class="text-gray-400 text-sm">กำลังโหลด...</div>
        </div>
    </main>

    <script src="js/config.env.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/profile.js"></script>
    <script>
        (function() {
            if (!UI.initPage('profile')) return;
            Auth.autoLinkUser().then(function() {
                return Auth.loadProfile();
            }).then(function() { Profile.init(); });
        })();
    </script>
</body>
</html>
