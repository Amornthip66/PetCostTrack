<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCostTrack - ตั้งรหัสผ่านใหม่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { pet: { light: '#f2ebfa', DEFAULT: '#663399', dark: '#4b2673' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20260909">
    <style>body { background-color: #f8f6fb; }</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-purple-100 px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fa-solid fa-key text-4xl text-pet mb-3"></i>
            <h1 class="text-2xl font-bold text-gray-900">ตั้งรหัสผ่านใหม่</h1>
            <p class="text-gray-500 mt-1 text-sm">PetCostTrack</p>
        </div>

        <!-- ลิงก์ไม่ถูกต้อง / หมดอายุ -->
        <div id="invalidPanel" class="hidden text-center">
            <p id="invalidMessage" class="text-red-500 text-sm mb-6">ลิงก์ตั้งรหัสผ่านไม่ถูกต้องหรือหมดอายุแล้ว</p>
            <a href="login.html" class="w-full inline-block btn btn-primary">กลับไปขอลิงก์ใหม่ที่หน้าเข้าสู่ระบบ</a>
        </div>

        <!-- ฟอร์มตั้งรหัสผ่านใหม่ -->
        <form id="resetForm" onsubmit="ResetPassword.submit(event)" class="hidden">
            <div class="space-y-4">
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
                    <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
                    <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pet focus:border-pet outline-none">
                </div>
            </div>
            <button type="submit" id="resetBtn" class="w-full mt-6 btn btn-primary"><span>บันทึกรหัสผ่านใหม่</span></button>
            <p id="resetError" class="text-red-500 text-sm mt-2 text-center hidden"></p>
        </form>

        <!-- สำเร็จ -->
        <div id="successPanel" class="hidden text-center">
            <p class="text-green-600 text-sm mb-6">ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว กำลังพาไปหน้าเข้าสู่ระบบ...</p>
            <a href="login.html" class="w-full inline-block btn btn-primary">เข้าสู่ระบบด้วยรหัสผ่านใหม่</a>
        </div>
    </div>

    <script src="js/config.env.js?v=20260913"></script>
    <script src="js/api.js?v=20260913"></script>
    <script src="js/auth.js?v=20261013"></script>
    <script src="js/reset-password.js?v=20261013"></script>
</body>
</html>
